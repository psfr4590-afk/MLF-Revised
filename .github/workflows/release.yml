name: Release Gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and release dependencies
        run: pip install -r requirements-dev.txt
      - name: Install package builder
        run: pip install "build>=1.2,<2"
      - name: Install security gate tooling
        run: pip install -r requirements-security.txt
      - name: Install package metadata
        run: pip install . --no-deps
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$project_version" || { echo "Tag $tag_version does not match pyproject version $project_version"; exit 1; }
      - name: Security gate
        run: python scripts/security_gate.py
      - name: Dependency and SBOM evidence
        run: python scripts/generate_release_evidence.py
      - name: Build distributable package
        run: python -m build --outdir dist
      - name: Production release verification
        run: python scripts/verify_release.py --bootstrap-native --ui-probe --clean-clone
      - name: Capture native reproducibility evidence
        run: python scripts/generate_release_evidence.py --native
      - name: Attest distributable package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload distributable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-lab-framework-dist
          path: dist/
          if-no-files-found: error
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: release-evidence/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* release-evidence/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
