name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Install security gate tooling
        run: pip install -r requirements-security.txt
      - name: Install package metadata
        run: pip install . --no-deps
      - name: Security gate
        run: python scripts/security_gate.py
